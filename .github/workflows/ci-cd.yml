name: Build-Test-Push-to-DockerHub

on:
  push:
    branches: [main]

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          IMAGE_NAME="${{ secrets.DOCKERHUB_USERNAME }}/devopsexam"
          TAG="${IMAGE_NAME}:${{ github.sha }}"
          docker build -t "$TAG" .

      - name: Run & test container locally
        run: |
          IMAGE_NAME="${{ secrets.DOCKERHUB_USERNAME }}/devopsexam"
          TAG="${IMAGE_NAME}:${{ github.sha }}"
          docker run -d --name smoke-test -p 5000:5000 "$TAG"
          sleep 10
          curl -f http://localhost:5000/ || (docker logs smoke-test && exit 1)
          docker stop smoke-test
          docker rm smoke-test

      - name: Push Docker image to Docker Hub
        run: |
          IMAGE_NAME="${{ secrets.DOCKERHUB_USERNAME }}/devopsexam"
          TAG="${IMAGE_NAME}:${{ github.sha }}"
          docker push "$TAG"

      - name: Tag & push as "latest"
        run: |
          IMAGE_NAME="${{ secrets.DOCKERHUB_USERNAME }}/devopsexam"
          docker tag "$IMAGE_NAME:${{ github.sha }}" "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:latest"
