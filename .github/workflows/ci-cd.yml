name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build Docker image
        run: |
          docker build -t flask-app:latest .

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Run and test container
        run: |
          docker run -d --name test -p 5000:5000 flask-app:latest
          sleep 10
          curl -f http://localhost:5000 || exit 1
          docker stop test
          docker rm test

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v3
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.REMOTE_SSH_KEY }}
      - name: Deploy to VM
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@YOUR_VM_IP \
            "docker pull flask-app:latest || true && \
             docker stop flask-app || true && \
             docker rm flask-app || true && \
             docker run -d \
               --name flask-app \
               -p 5000:5000 \
               flask-app:latest"